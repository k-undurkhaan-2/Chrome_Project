[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armedforces-tool"
version = "0.1.0"
description = "Read-only tooling CLI for armedforces.io-v2 engineering workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
armedforces-tool = "armedforces_tool.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
